<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Recursos | IMIPAS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gob-green:#002f2a;--primary:#611232;--primary-blue:#33508d;--text:#161a1d;--text2:#98989A;--bg:#ffffff;--border:rgba(152, 152, 154, 0.4);}
body{font-family:'Noto Sans', sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
.gobmx-topbar{background-color:var(--gob-green);height:48px;display:flex;align-items:center;padding:0 5%}
.gobmx-topbar img{height:28px}
.imipas-header{background-color:var(--bg);padding:24px 5%;border-bottom:4px solid var(--primary);display:flex;flex-direction:column;gap:6px}
.imipas-header h1{font-size:24px;color:var(--gob-green);font-weight:700}
.imipas-header h2{font-size:16px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:12px}
.version-badge{font-size:11px;background:var(--primary-blue);color:white;padding:3px 8px;border-radius:12px;font-weight:600}
.dashboard-container{display:flex;flex-direction:column;gap:24px;padding:30px 5%;max-width:1800px;margin:0 auto}
.map-chart-section{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:1200px){.map-chart-section{grid-template-columns:1fr}}
#loader{text-align:center;padding:80px;font-size:16px;color:var(--text2)}
.spinner{border:4px solid rgba(0,0,0,.1);width:40px;height:40px;border-radius:50%;border-left-color:var(--primary);animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.map-card,.chart-wrap{background:var(--bg);border-radius:8px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;position:relative;display:flex;flex-direction:column}
.map-card h3,.chart-wrap h3{padding:16px 20px;background:#f8f9fa;border-bottom:1px solid var(--border);font-size:14px;color:var(--gob-green);text-transform:uppercase;letter-spacing:0.5px}
#map{height:400px;width:100%}
#map-empty-overlay{display:none;position:absolute;top:50px;left:0;right:0;bottom:0;background:rgba(255,255,255,0.85);z-index:10;justify-content:center;align-items:center;color:var(--primary);font-weight:600}
.filter-bar input{padding:16px 20px;border:1px solid var(--border);border-radius:8px;font-size:15px;width:100%;font-family:'Noto Sans', sans-serif}
.table-wrap{background:var(--bg);border-radius:8px;border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--gob-green);color:#fff}
th{padding:14px 16px;text-align:left;font-size:13px;text-transform:uppercase}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
.main-row:hover{background:#fafafa;cursor:pointer}
.link-especie{color:var(--primary-blue);font-weight:700;cursor:pointer}
.tab-content{display:none;padding:30px 5% 40px 5%;max-width:1600px;margin:0 auto}
.btn-back{background:var(--bg);border:1px solid var(--border);padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>

<div class="gobmx-topbar"><img src="https://framework-gb.cdn.gob.mx/landing/img/logoheader.svg" alt="Gobierno de México"></div>
<header class="imipas-header">
  <h1>Instituto Mexicano de Investigación en Pesca y Acuacultura Sustentables</h1>
  <h2>Catálogo de recursos <span class="version-badge">v3.6.1</span></h2>
</header>

<div id="loader">
  <div class="spinner"></div>
  <p id="loader-msg">Cargando base de datos...</p>
</div>

<div id="main-dashboard" class="dashboard-container" style="display:none;">
  <div class="filter-section">
    <div class="filter-bar">
      <input type="text" id="search-esp" placeholder="Buscar..." onkeyup="filtrarDashboardGlobal()">
    </div>
  </div>
  
  <div class="map-chart-section">
    <div class="map-card">
      <h3 id="map-title">Distribución Geográfica <span class="titulo-dinamico-filtro">(Global)</span></h3>
      <div id="map-empty-overlay">Sin registros</div>
      <div id="map"></div>
    </div>
    
    <div class="chart-wrap">
      <h3 id="chart-title">Aviso Estadístico</h3>
      <div class="chart-container-box" id="global-chart-wrapper" style="padding:20px;">
        <p style="color:var(--text2); text-align:center;">Seleccione una especie.</p>
      </div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-wrap">
      <table id="tabla-recursos">
        <thead>
          <tr>
            <th>Recurso</th>
            <th>Nombre común</th>
            <th>Especie</th>
            <th>Litoral</th>
          </tr>
        </thead>
        <tbody id="esp-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="tab-ficha" class="tab-content">
  <button class="btn-back" onclick="cerrarFicha()">← Regresar</button>
  <div id="ficha-container"></div>
</div>

<footer class="gobmx-footer"></footer>

<script>
let supabase = null;
let datosIndice = [], datosCoordenadas = [], map, markerCluster;

async function sincronizarBaseDatos() {
  const loaderMsg = document.getElementById('loader-msg');
  try {
    // Verificar si la librería de Supabase cargó correctamente
    if (typeof window.supabase === 'undefined') {
      throw new Error("La librería de Supabase no se pudo cargar desde el CDN.");
    }

    if (!supabase) {
      supabase = window.supabase.createClient(
        'https://fhhocpfjwyhowrhrrqmh.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoaG9jcGZqd3lob3dyaHJycW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzA0NTAsImV4cCI6MjA5NjUwNjQ1MH0.ZS4sFMBZHxlQZgVe5JMUjatbURRnKoUbwcg45CyTUzo'
      );
    }

    loaderMsg.innerText = "Consultando tablas...";

    const [pRes, cRes] = await Promise.all([
        supabase.from('indice').select('*'), 
        supabase.from('coordenadas').select('*')
    ]);

    if (pRes.error) throw new Error("Tabla 'indice': " + pRes.error.message);
    if (cRes.error) throw new Error("Tabla 'coordenadas': " + cRes.error.message);

    datosIndice = pRes.data || []; 
    datosCoordenadas = cRes.data || [];
    
    document.getElementById('loader').style.display = 'none';
    document.getElementById('main-dashboard').style.display = 'flex';
    
    renderTabla(datosIndice);
    initMap();
  } catch (e) { 
    console.error(e);
    document.getElementById('loader').innerHTML = `
      <div style="color:#611232; font-weight:bold; max-width:600px; margin:0 auto; padding:20px; border:1px solid #611232; border-radius:8px; background:#fff5f5;">
        <p style="font-size:16px; margin-bottom:8px;">⚠️ Error de conexión con Supabase</p>
        <p style="font-size:13px; font-weight:normal; color:#333;">${e.message || e}</p>
        <button onclick="location.reload()" style="margin-top:15px; padding:8px 16px; background:#002f2a; color:#fff; border:none; border-radius:4px; cursor:pointer;">Reintentar</button>
      </div>`;
  }
}

function renderTabla(datos) {
  const tbody = document.getElementById('esp-tbody');
  tbody.innerHTML = '';
  datos.forEach(item => {
    const c = item['Común'] || item['común'] || item['comun'] || '';
    const tr = document.createElement('tr');
    tr.className = 'main-row';
    const cEscaped = c.replace(/'/g, "\\'");
    tr.innerHTML = `<td>${item['Recurso'] || ''}</td><td><a class="link-especie" onclick="abrirFicha('${cEscaped}')">${item['Nombre común'] || c}</a></td><td>${item['Especie'] || ''}</td><td>${item['Litoral'] || ''}</td>`;
    tbody.appendChild(tr);
  });
}

function initMap() {
  if(map) map.remove();
  map = L.map('map').setView([23.63, -102.55], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
  markerCluster = L.markerClusterGroup();
  map.addLayer(markerCluster);
  datosCoordenadas.forEach(upa => {
    const lat = parseFloat(upa['Latitud'] || upa['latitud']), lng = parseFloat(upa['Longitud'] || upa['longitud']);
    if(!isNaN(lat)) L.marker([lat, lng]).addTo(markerCluster).bindPopup(upa['nombre_upa'] || 'Unidad');
  });
}

function filtrarDashboardGlobal() {
  const input = document.getElementById("search-esp").value.toLowerCase();
  renderTabla(datosIndice.filter(i => JSON.stringify(i).toLowerCase().includes(input)));
}

async function abrirFicha(c) {
  document.getElementById('main-dashboard').style.display = 'none';
  document.getElementById('tab-ficha').style.display = 'block';
  document.getElementById('ficha-container').innerHTML = 'Cargando detalles...';
  try {
    const { data: f, error } = await supabase.from('fichas').select('*');
    if (error) throw error;
    const ficha = (f || []).find(x => (x['Común'] || x['común'] || x['comun']) === c) || {};
    document.getElementById('ficha-container').innerHTML = `<h1>${c}</h1><p>${ficha['Distribución geográfica'] || 'Sin datos'}</p>`;
  } catch(err) {
    document.getElementById('ficha-container').innerHTML = `<p style="color:red;">Error al cargar la ficha: ${err.message}</p>`;
  }
}

function cerrarFicha() {
  document.getElementById('tab-ficha').style.display = 'none';
  document.getElementById('main-dashboard').style.display = 'flex';
}

document.addEventListener('DOMContentLoaded', sincronizarBaseDatos);
</script>
</body>
</html>
