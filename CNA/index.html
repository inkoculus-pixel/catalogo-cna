<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo | IMIPAS</title>
    </head>
<body>
    <script>
const SHEET_CAPTURA_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-J0WwCyv07TWzqZi7_J2bDphc1qxMt9i089UhsGITwLWfAHOnW0ecfwkWAqnj1p-cqocrIM0CKC8d/pub?output=csv';

// Función para limpiar nombres de columnas y hacer el código robusto ante cambios en la base
function normalizeKey(key) {
    if(!key) return "";
    return key.toString().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
}

async function sincronizarGoogleSheets() {
    try {
        const resCaptura = await fetch(SHEET_CAPTURA_URL).then(r => r.text());
        const rawData = Papa.parse(resCaptura, { header: true, skipEmptyLines: true }).data;
        
        // Mapeo automático usando la normalización
        datosCaptura = rawData.map(row => {
            let cleanRow = {};
            Object.keys(row).forEach(k => cleanRow[normalizeKey(k)] = row[k]);
            return cleanRow;
        });

        console.log("Datos normalizados listos:", datosCaptura[0]);
        // Continuar con la lógica de renderizado...
    } catch (e) { console.error("Error en sincronización:", e); }
}

function actualizarGraficaConsolidada(comunesValidos) {
    if (capChart) capChart.destroy();
    
    // Acceso a datos usando claves normalizadas
    const filtered = datosCaptura.filter(d => comunesValidos.includes(d['COMUN']));
    
    const años = [...new Set(filtered.map(d => d['ANO']))].sort();
    const entidades = [...new Set(filtered.map(d => d['ENTIDAD']))];
    
    const ctx = document.getElementById('cap-chart').getContext('2d');
    capChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: años,
            datasets: entidades.map((ent, i) => ({
                label: ent,
                data: años.map(a => filtered.filter(f => f['ANO'] === a && f['ENTIDAD'] === ent)
                    .reduce((sum, curr) => sum + parseFloat(curr['PESO VIVO (KG)'] || 0), 0)),
                backgroundColor: `hsl(${i * 60}, 50%, 50%)`
            }))
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}
</script>
</body>
</html>
