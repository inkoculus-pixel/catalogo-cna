<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de recursos | IMIPAS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#611232;
  --primary-dark:#4a0e27;
  --secondary:#a57f2c;
  --bg:#ffffff; 
  --border:#dee2e6;
  --text:#212529;
  --text2:#6c757d;
}
body{font-family:'Noto Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER INSTITUCIONAL */
.gob-header{background:var(--primary);color:#fff;text-align:center; position:relative;}
.gob-main{padding:24px 20px; display:flex; flex-direction:column; align-items:center; gap:8px;}
.gob-logo{font-size:32px;font-weight:700;letter-spacing:-0.5px;}
.gob-subtitle{font-size:18px; font-weight:500; opacity:.9; display:flex; align-items:center; gap:10px; justify-content:center;}
.version-badge{font-size:11px; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:12px; font-weight:600; letter-spacing:0.5px;}

/* SUBNAV TABS */
.subnav{background:var(--primary-dark);display:flex;overflow-x:auto; justify-content:center;}
.subnav button{background:none;border:none;color:#ffffffcc;padding:12px 24px;font-size:14px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.subnav button:hover,.subnav button.active{color:#fff;border-bottom-color:var(--secondary);background:rgba(255,255,255,.08)}

/* LAYOUT & CARGA */
.tab-content{display:none; padding:30px 24px; max-width:1400px; margin:0 auto;}
.tab-content.active{display:block}
#loader{text-align:center; padding:80px; font-size:16px; color:var(--text2);}
.spinner {border: 4px solid rgba(0,0,0,.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 0 auto 15px;}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* MAPA PRINCIPAL */
#map{height:calc(100vh - 280px);width:100%; border-radius:8px; border:1px solid var(--border); z-index: 1;}

/* TABLA EXPANDIBLE */
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.filter-bar input, .filter-bar select{padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;flex:1;min-width:250px; font-family:'Noto Sans';}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
thead{background:var(--primary);color:#fff}
th{padding:12px 14px;text-align:left;font-size:13px;font-weight:600;}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}

.main-row{transition: background 0.2s;}
.main-row:hover{background:#f8f0f2;}
.details-row{display:none; background:#fafafa;}
.details-content{padding:16px 20px; border-left:4px solid var(--primary); color:var(--text2); font-size:13px; display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;}

/* ENLACE DE TABLA */
.link-especie{color:var(--primary); text-decoration:none; font-weight:700; cursor:pointer;}
.link-especie:hover{text-decoration:underline; color:var(--secondary);}

/* FICHA TÉCNICA */
.btn-back{background:#f8f9fa; border:1px solid var(--border); padding:8px 16px; border-radius:6px; cursor:pointer; font-family:'Noto Sans'; font-weight:600; color:var(--text); margin-bottom:20px; display:inline-flex; align-items:center;}
.btn-back:hover{background:#e9ecef;}

.ficha-header{display:flex; flex-wrap:wrap; gap:24px; margin-bottom:24px; align-items:flex-start;}
.ficha-img-box{flex:0 0 300px; border-radius:8px; overflow:hidden; border:1px solid var(--border); background:#f8f9fa; text-align:center;}
.ficha-img-box img{width:100%; height:auto; object-fit:cover; display:block;}
.ficha-title-box{flex:1; min-width:300px;}
.ficha-title-box h1{font-size:32px; color:var(--primary); margin-bottom:8px; text-transform:uppercase; letter-spacing:-0.5px;}

.ficha-grid{display:grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap:20px;}
.ficha-card{background:#fff; border:1px solid var(--border); border-radius:8px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ficha-card h4{color:var(--primary); border-bottom:2px solid #f0f0f0; padding-bottom:8px; margin-bottom:12px; font-size:15px; text-transform:uppercase; letter-spacing:0.5px;}
.data-item{margin-bottom:10px; font-size:13.5px; line-height:1.5;}
.data-item strong{color:#444; display:block; font-size:12px; text-transform:uppercase; color:var(--text2);}
.data-item span{display:block; color:var(--text); margin-top:2px;}

/* MAPA DENTRO DE FICHA */
#map-ficha{height:300px; width:100%; border-radius:8px; border:1px solid var(--border); z-index:1; margin-top:10px;}

/* CAPTURA */
.chart-wrap{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06); max-width: 900px; margin:0 auto;}
select{padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px; min-width:300px; font-family:'Noto Sans';}

/* FOOTER */
.gob-footer{background:#2c2c2c;color:#fff;padding:24px;text-align:center;font-size:12px;margin-top:40px}
</style>
</head>
<body>

<header class="gob-header">
  <div class="gob-main">
    <div class="gob-logo">IMIPAS</div>
    <div class="gob-subtitle">
      Catálogo de recursos <span class="version-badge">v1.2</span>
    </div>
  </div>
</header>

<nav class="subnav" id="menu" style="display:none;">
  <button class="active" id="btn-catalogo" onclick="showTab('especies',this)">Catálogo</button>
  <button onclick="showTab('mapa',this)">Mapa de UPAs</button>
  <button onclick="showTab('captura',this)">Datos de Captura</button>
</nav>

<div id="loader">
  <div class="spinner"></div>
  <p>Sincronizando datos...</p>
</div>

<div id="tab-especies" class="tab-content active">
  <div class="filter-bar">
    <input type="text" id="search-esp" placeholder="Buscar recurso, especie o zona..." onkeyup="filtrarTabla()">
  </div>
  <div style="overflow-x:auto;">
    <table id="tabla-recursos">
      <thead>
        <tr>
          <th>Recurso</th>
          <th>Nombre común</th>
          <th>Especie Científica</th>
          <th>Litoral</th>
        </tr>
      </thead>
      <tbody id="esp-tbody"></tbody>
    </table>
  </div>
</div>

<div id="tab-ficha" class="tab-content">
  <button class="btn-back" onclick="cerrarFicha()">← Regresar al Catálogo</button>
  <div id="ficha-container">
    </div>
</div>

<div id="tab-mapa" class="tab-content">
  <div class="filter-bar">
    <select id="map-esp-select" onchange="filtrarMapa()">
      <option value="">— Mostrar todas las Especies —</option>
    </select>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
  </div>
</div>

<div id="tab-captura" class="tab-content">
  <div style="text-align:center; margin-bottom:20px;">
    <select id="cap-select" onchange="updateCaptura()">
      <option value="">— Seleccionar Especie para ver histórico —</option>
    </select>
  </div>
  <div class="chart-wrap">
    <canvas id="cap-chart" height="120"></canvas>
  </div>
</div>

<footer class="gob-footer">
  <b>IMIPAS</b> – Instituto Mexicano de Investigación en Pesca y Acuacultura Sustentable
</footer>

<script>
const SHEET_ID = '1beFh_u5LFSZNiF5Gpk9SYpWOrJWlrRzSZtuNkf4qcfs';

let datosIndice = [];
let datosCoordenadas = [];
let datosCaptura = [];
let datosFicha = []; 
let map;
let markerCluster;
let capChart;
let mapFichaInstance = null; // Instancia independiente para el mapa de la Ficha Técnica

async function sincronizarGoogleSheets() {
  try {
    const urlIndice = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=indice`;
    const urlCoordenadas = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=coordenadas`;
    const urlCaptura = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=captura`;
    const urlFicha = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Datos%20de%20ficha`; 

    const [resIndice, resCoord, resCaptura, resFicha] = await Promise.all([
      fetch(urlIndice), 
      fetch(urlCoordenadas), 
      fetch(urlCaptura).catch(() => null),
      fetch(urlFicha).catch(() => null)
    ]);

    datosIndice = Papa.parse(await resIndice.text(), { header: true, skipEmptyLines: true }).data;
    datosCoordenadas = Papa.parse(await resCoord.text(), { header: true, skipEmptyLines: true }).data;
    
    if(resCaptura && resCaptura.ok) datosCaptura = Papa.parse(await resCaptura.text(), { header: true, skipEmptyLines: true }).data;
    if(resFicha && resFicha.ok) datosFicha = Papa.parse(await resFicha.text(), { header: true, skipEmptyLines: true }).data;

    document.getElementById('loader').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    
    renderTabla(datosIndice);
    initMap();
    if(datosCaptura.length > 0) initCaptura();

  } catch (error) {
    document.getElementById('loader').innerHTML = `<p style="color:var(--primary)">Error al conectar con la base de datos.</p>`;
    console.error(error);
  }
}

function showTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  if(btn) {
    document.querySelectorAll('.subnav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  document.getElementById('tab-' + tabId).style.display = 'block';
  if (tabId === 'mapa' && map) setTimeout(() => map.invalidateSize(), 100);
}

// --- TABLA E ÍNDICE ---
function renderTabla(datos) {
  const tbody = document.getElementById('esp-tbody');
  tbody.innerHTML = '';
  
  datos.forEach((item) => {
    const valorComun = item['Común'] || '';
    const displayNombre = item['Nombre común'] || valorComun || 'Sin nombre';
    
    const tr = document.createElement('tr');
    tr.className = 'main-row';
    
    tr.onclick = (e) => {
      if(e.target.tagName.toLowerCase() === 'a') return; 
      const isHidden = trDetails.style.display === 'none' || trDetails.style.display === '';
      trDetails.style.display = isHidden ? 'table-row' : 'none';
      tr.style.background = isHidden ? '#f8f0f2' : '';
    };

    tr.innerHTML = `
      <td>${item['Recurso'] || ''}</td>
      <td><a class="link-especie" data-comun="${valorComun}" onclick="abrirFicha(this.getAttribute('data-comun'))">${displayNombre}</a></td>
      <td><em>${item['Especie'] || item['Nombre científico'] || ''}</em></td>
      <td>${item['Litoral'] || ''}</td>
    `;
    
    const trDetails = document.createElement('tr');
    trDetails.className = 'details-row';
    trDetails.innerHTML = `
      <td colspan="4" style="padding: 0;">
        <div class="details-content">
          <div><p><strong>Zona:</strong></p><p>${item['Zona'] || 'N/A'}</p></div>
          <div><p><strong>Año:</strong></p><p>${item['Año'] || item['anio'] || 'N/A'}</p></div>
          <div><p><strong>Estatus vigente:</strong></p><p>${item['Estatus vigente'] || item['Estatus'] || 'N/A'}</p></div>
          <div><p><strong>Carta Nacional:</strong></p><p>${item['Carta Nacional'] || 'N/A'}</p></div>
        </div>
      </td>
    `;

    tbody.appendChild(tr);
    tbody.appendChild(trDetails);
  });
}

function filtrarTabla() {
  const input = document.getElementById("search-esp").value.toLowerCase();
  const rows = document.getElementById("esp-tbody").children;
  for (let i = 0; i < rows.length; i += 2) {
    const mainRow = rows[i];
    const detailsRow = rows[i+1];
    const textToSearch = (mainRow.innerText + " " + detailsRow.innerText).toLowerCase();
    if (textToSearch.includes(input)) {
      mainRow.style.display = "";
    } else {
      mainRow.style.display = "none";
      detailsRow.style.display = "none";
      mainRow.style.background = '';
    }
  }
}

// --- FICHA TÉCNICA DINÁMICA ---
function renderDato(label, key, item) {
  const val = item[key] || item[key + ':'] || '';
  if (!val || val.trim() === '') return '';
  return `<div class="data-item"><strong>${label}</strong><span>${val}</span></div>`;
}

function abrirFicha(valorComun) {
  const itemFicha = datosFicha.find(d => d['Común'] === valorComun);
  const itemIndice = datosIndice.find(d => d['Común'] === valorComun) || {};
  const item = { ...itemIndice, ...(itemFicha || {}) };

  const container = document.getElementById('ficha-container');
  
  // Título principal con la llave "Común"
  const tituloPrincipal = item['Común'] || 'Especie';
  const nombreComun = item['Nombre común'] || 'N/A';
  const nombreCientifico = item['Nombre científico'] || item['Especie'] || '';
  
  let imgUrl = item['Imagenspp'] || item['Foto de la especie'];
  let imgHTML = '';
  if(imgUrl && imgUrl.startsWith('http')) {
    imgHTML = `<div class="ficha-img-box"><img src="${imgUrl}" alt="${tituloPrincipal}"></div>`;
  }

  container.innerHTML = `
    <div class="ficha-header">
      ${imgHTML}
      <div class="ficha-title-box">
        <h1>${tituloPrincipal}</h1>
        
        <div style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
          <strong style="color:var(--primary); font-size:13px; text-transform:uppercase;">Nombre Común</strong>
          <span style="font-size:18px; display:block; color:var(--text); font-weight:500; margin-top:2px;">${nombreComun}</span>
          <em style="color:var(--text2); font-size:15px; display:block; margin-top:4px;">${nombreCientifico}</em>
        </div>
        
        <div style="display:flex; gap:20px; flex-wrap:wrap; background:#f8f9fa; padding:16px; border-radius:8px; border:1px solid var(--border);">
          ${renderDato('Estatus del cultivo', 'Estatus del cultivo', item)}
          ${renderDato('Nivel de dominio biotecnológico', 'Nivel de dominio de la biotecnología', item)}
          ${renderDato('Origen', 'Origen', item)}
          ${renderDato('Mercado', 'Mercado', item)}
        </div>

        <div style="margin-top: 24px;">
            <h4 style="color:var(--primary); font-size:14px; text-transform:uppercase; margin-bottom:10px;">Distribución de UPAs para ${tituloPrincipal}</h4>
            <div id="map-ficha"></div>
        </div>
      </div>
    </div>

    <div class="ficha-grid">
      <div class="ficha-card">
        <h4>Biología y Ecología</h4>
        ${renderDato('Distribución geográfica', 'Distribución geográfica', item)}
        ${renderDato('Hábitat (natural)', 'Hábitat (natural)', item)}
        ${renderDato('Morfología', 'Morfología', item)}
        ${renderDato('Ciclo de vida', 'Ciclo de vida', item)}
        ${renderDato('Alimentación en medio natural', 'Alimentación en medio natural', item)}
      </div>

      <div class="ficha-card">
        <h4>Biotecnología y Cultivo</h4>
        ${renderDato('Biotecnología', 'Biotecnología', item)}
        ${renderDato('Sistemas de cultivo', 'Sistemas de cultivo', item)}
        ${renderDato('Artes de cultivo', 'Artes de cultivo', item)}
        ${renderDato('Características de la zona', 'Características de la zona de cultivo', item)}
        ${renderDato('Densidad de siembra', 'Densidad de siembra', item)}
        ${renderDato('Flujo de agua', 'Promedio de flujo de agua para el cultivo', item)}
        ${renderDato('Tamaño para siembra', 'Tamaño del organismo para siembra', item)}
        ${renderDato('Origen / Procedencia semilla', 'Origen semilla', item)}
        ${renderDato('Procedencia', 'Procedencia', item)}
        ${renderDato('Alimento', 'ALIMENTO', item)}
        ${renderDato('Tiempo de cultivo', 'Tiempo de cultivo', item)}
        ${renderDato('Porcentaje de sobrevivencia', 'Porcentaje de sobrevivencia', item)}
        ${renderDato('Tamaño de cosecha', 'Tamaño promedio de cosecha', item)}
      </div>

      <div class="ficha-card">
        <h4>Sanidad y Manejo Ecosistémico</h4>
        ${renderDato('Importancia de sanidad', 'Importancia de la sanidad acuícola', item)}
        ${renderDato('Enfermedades reportadas', 'Enfermedades reportadas', item)}
        ${renderDato('Sanidad general', 'Sanidad', item)}
        ${renderDato('Buenas prácticas', 'Buenas prácticas de producción acuícola', item)}
        ${renderDato('Manejo ecosistémico', 'MANEJO ECOSISTEMICO', item)}
        ${renderDato('Efectos ambientales', 'Efectos ambientales y cambio climático', item)}
      </div>

      <div class="ficha-card">
        <h4>Mercado y Comercialización</h4>
        ${renderDato('Comercialización', 'Comercialización', item)}
        ${renderDato('Presentación del producto', 'Presentación del producto', item)}
        ${renderDato('Precios', 'Precios del producto', item)}
        ${renderDato('Mercado del producto', 'Mercado del producto', item)}
        ${renderDato('Tecnología de alimentos', 'Tecnología de alimentos', item)}
      </div>

      <div class="ficha-card" style="grid-column: 1 / -1;">
        <h4>Información Adicional</h4>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
          <div>
            ${renderDato('Entidades de cultivo', 'ENTIDADES DE CULTIVO', item)}
            ${renderDato('Antecedentes', 'ANTECEDENTES', item)}
            ${renderDato('Desarrollo tecnológico', 'Desarrollo tecnológico', item)}
          </div>
          <div>
            ${renderDato('Limitantes técnico-biológicas', 'Limitantes técnico-biológicas de la actividad', item)}
            ${renderDato('Información y trámites', 'INFORMACIÓN Y TRÁMITES', item)}
            ${renderDato('Normatividad', 'NORMATIVIDAD', item)}
            ${renderDato('Bibliografía', 'BIBLIOGRAFÍA CONSULTADA', item)}
          </div>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.getElementById('tab-ficha').style.display = 'block';
  window.scrollTo(0, 0);

  // INICIALIZACIÓN DEL MAPA ESPECÍFICO DE LA FICHA
  setTimeout(() => {
    if(mapFichaInstance) {
      mapFichaInstance.remove();
    }
    
    mapFichaInstance = L.map('map-ficha').setView([23.6345, -102.5528], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(mapFichaInstance);
    
    const clusterFicha = L.markerClusterGroup();
    let hayPuntos = false;

    datosCoordenadas.forEach(upa => {
      const comunUPA = upa['Común'] || '';
      if (comunUPA === valorComun) {
        const lat = parseFloat(upa['LATITUD F'] || upa['latitud']);
        const lng = parseFloat(upa['LONGITD F'] || upa['longitud']);
        
        if(!isNaN(lat) && !isNaN(lng)) {
          hayPuntos = true;
          const marker = L.marker([lat, lng]);
          marker.bindPopup(`
            <div style="font-family:'Noto Sans'; font-size:13px;">
              <h4 style="color:var(--primary); margin-bottom:6px; border-bottom:1px solid var(--border); padding-bottom:4px;">
                ${upa['nombre_upa'] || upa['Nombre'] || 'Unidad de Producción'}
              </h4>
              <p style="margin-bottom:4px;"><b>Especie:</b> ${upa['Nombre común'] || comunUPA}</p>
              <p style="margin-bottom:4px;"><b>Superficie (ha):</b> ${upa['Superficie de producción (ha)'] || 'N/A'}</p>
              <p style="margin-bottom:0;"><b>Tipo de instalación:</b> ${upa['Tipo de instalación'] || 'N/A'}</p>
            </div>
          `);
          clusterFicha.addLayer(marker);
        }
      }
    });

    mapFichaInstance.addLayer(clusterFicha);
    
    if (hayPuntos) {
      mapFichaInstance.fitBounds(clusterFicha.getBounds().pad(0.1));
    }
  }, 100);
}

function cerrarFicha() {
  document.getElementById('tab-ficha').style.display = 'none';
  document.getElementById('tab-especies').style.display = 'block';
}

// --- MAPA PRINCIPAL ---
function initMap() {
  map = L.map('map').setView([23.6345, -102.5528], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
  markerCluster = L.markerClusterGroup();
  map.addLayer(markerCluster);

  const selectMap = document.getElementById('map-esp-select');
  const seenComun = new Set();
  const options = [];

  datosCoordenadas.forEach(item => {
    const comun = item['Común'];
    if(comun && !seenComun.has(comun)) {
      seenComun.add(comun);
      const display = item['Nombre común'] || item['Común']; 
      options.push({ value: comun, text: display });
    }
  });

  options.sort((a,b) => a.text.localeCompare(b.text)).forEach(opt => {
    selectMap.appendChild(new Option(opt.text, opt.value));
  });

  renderMarcadores("");
}

function filtrarMapa() {
  renderMarcadores(document.getElementById('map-esp-select').value);
}

function renderMarcadores(filtroComun) {
  markerCluster.clearLayers();
  datosCoordenadas.forEach(upa => {
    const comunUPA = upa['Común'] || '';
    if (filtroComun && comunUPA !== filtroComun) return;

    const lat = parseFloat(upa['LATITUD F'] || upa['latitud']);
    const lng = parseFloat(upa['LONGITD F'] || upa['longitud']);
    
    if(!isNaN(lat) && !isNaN(lng)) {
      const marker = L.marker([lat, lng]);
      marker.bindPopup(`
        <div style="font-family:'Noto Sans'; font-size:13px;">
          <h4 style="color:var(--primary); margin-bottom:6px; border-bottom:1px solid var(--border); padding-bottom:4px;">
            ${upa['nombre_upa'] || upa['Nombre'] || 'Unidad de Producción'}
          </h4>
          <p style="margin-bottom:4px;"><b>Especie:</b> ${upa['Nombre común'] || comunUPA}</p>
          <p style="margin-bottom:4px;"><b>Superficie de producción (ha):</b> ${upa['Superficie de producción (ha)'] || 'N/A'}</p>
          <p style="margin-bottom:4px;"><b>Número de cuerpos de agua:</b> ${upa['Número de cuerpos de agua'] || 'N/A'}</p>
          <p style="margin-bottom:4px;"><b>Función zootécnica:</b> ${upa['Función zootécnica'] || 'N/A'}</p>
          <p style="margin-bottom:0;"><b>Tipo de instalación:</b> ${upa['Tipo de instalación'] || 'N/A'}</p>
        </div>
      `);
      markerCluster.addLayer(marker);
    }
  });
}

// --- GRÁFICAS DE CAPTURA ---
function initCaptura() {
  const select = document.getElementById('cap-select');
  const seenComun = new Set();
  const options = [];

  datosCaptura.forEach(item => {
    const comun = item['Común'];
    if(comun && !seenComun.has(comun)) {
      seenComun.add(comun);
      const display = item['Nombre común'] || item['Común'];
      options.push({ value: comun, text: display });
    }
  });

  options.sort((a,b) => a.text.localeCompare(b.text)).forEach(opt => {
    select.appendChild(new Option(opt.text, opt.value));
  });
}

function updateCaptura() {
  const comunSel = document.getElementById('cap-select').value;
  if (!comunSel) return;

  const datosFiltrados = datosCaptura.filter(item => item['Común'] === comunSel);
  datosFiltrados.sort((a, b) => (a.anio || a.Año) - (b.anio || b.Año));

  const labels = datosFiltrados.map(d => d.anio || d.Año);
  const weights = datosFiltrados.map(d => Math.round((d.peso_kg || d.Peso) / 1000) || 0); 
  const valores = datosFiltrados.map(d => Math.round((d.valor_pesos || d.Valor) / 1000000) || 0);

  if (capChart) capChart.destroy();
  const ctx = document.getElementById('cap-chart').getContext('2d');
  
  capChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { type: 'bar', label: 'Peso (Toneladas)', data: weights, backgroundColor: 'rgba(97,18,50,0.7)', borderColor: '#611232', borderWidth: 1, yAxisID: 'y' },
        { type: 'line', label: 'Valor (Millones MXP)', data: valores, borderColor: '#a57f2c', backgroundColor: 'rgba(165,127,44,0.1)', borderWidth: 2, pointRadius: 4, yAxisID: 'y1' }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { position: 'left', title: { display: true, text: 'Toneladas' } },
        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Millones MXP' } }
      }
    }
  });
}

window.onload = sincronizarGoogleSheets;
</script>
