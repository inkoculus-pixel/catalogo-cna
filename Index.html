<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de recursos | IMIPAS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box; margin:0; padding:0;}
:root{
  --primary: #611232;
  --primary-dark: #4a0e27;
  --secondary: #a57f2c;
  --bg: #ffffff; /* Fondo blanco puro */
  --border: #dee2e6;
  --text: #212529;
  --text2: #6c757d;
}
body{font-family:'Noto Sans', sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}

/* HEADER INSTITUCIONAL: Logo arriba del título */
.gob-header{background:var(--primary); color:#fff; text-align:center;}
.gob-top{background:#000; padding:4px 16px; font-size:11px; display:flex; gap:8px;}
.gob-main{padding:24px 20px;}
.gob-logo{font-size:32px; font-weight:700; letter-spacing:-0.5px; margin-bottom: 8px;}
.gob-subtitle{font-size:18px; font-weight:500; opacity:.9;}

/* NAVEGACIÓN */
.subnav{background:var(--primary-dark); display:flex; overflow-x:auto; justify-content:center;}
.subnav button{background:none; border:none; color:rgba(255,255,255,0.8); padding:14px 24px; font-size:14px; cursor:pointer; font-weight:500; border-bottom:3px solid transparent; transition:all .2s; white-space:nowrap;}
.subnav button:hover, .subnav button.active{color:#fff; border-bottom-color:var(--secondary); background:rgba(255,255,255,.08);}

/* CONTENEDORES */
.tab-content{display:none; padding:30px 24px; max-width:1200px; margin:0 auto;}
.tab-content.active{display:block;}

/* CARGADOR */
#loader{text-align:center; padding:80px; font-size:16px; color:var(--text2);}
.spinner{border:4px solid rgba(0,0,0,.1); width:40px; height:40px; border-radius:50%; border-left-color:var(--primary); animation:spin 1s linear infinite; margin:0 auto 15px;}
@keyframes spin { 0% {transform:rotate(0deg);} 100% {transform:rotate(360deg);} }

/* TABLAS */
.filter-bar{display:flex; margin-bottom:20px;}
.filter-bar input{padding:10px 14px; border:1px solid var(--border); border-radius:6px; font-size:14px; width:100%; max-width:400px; font-family:'Noto Sans';}
table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06);}
thead{background:var(--primary); color:#fff;}
th{padding:12px 14px; text-align:left; font-size:13px; font-weight:600;}
td{padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border);}
tr:hover td{background:#f8f0f2;}

/* MAPA */
#map{height:calc(100vh - 280px); width:100%; border-radius:8px; border:1px solid var(--border); z-index:1;}

/* GRÁFICAS */
.chart-wrap{background:#fff; border-radius:8px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); max-width:900px; margin:0 auto;}
select{padding:10px 14px; border:1px solid var(--border); border-radius:6px; font-size:14px; min-width:300px; font-family:'Noto Sans';}

/* FOOTER */
.gob-footer{background:#2c2c2c; color:#fff; padding:24px; text-align:center; font-size:12px; margin-top:40px;}
</style>
</head>
<body>

<header class="gob-header">
  <div class="gob-top">
    <span>● gob.mx</span><span style="opacity:.6">|</span><span>Gobierno de México</span>
  </div>
  <div class="gob-main">
    <div class="gob-logo">IMIPAS</div>
    <div class="gob-subtitle">Catálogo de recursos</div>
  </div>
</header>

<nav class="subnav" id="menu" style="display:none;">
  <button class="active" onclick="showTab('especies',this)">Catálogo</button>
  <button onclick="showTab('mapa',this)">Mapa de UPAs</button>
  <button onclick="showTab('captura',this)">Datos de Captura</button>
</nav>

<div id="loader">
  <div class="spinner"></div>
  <p>Conectando con la base de datos...</p>
</div>

<div id="tab-especies" class="tab-content active">
  <div class="filter-bar">
    <input type="text" id="search-esp" placeholder="Buscar recurso, especie o zona..." onkeyup="filtrarTabla()">
  </div>
  <div style="overflow-x:auto;">
    <table id="tabla-recursos">
      <thead>
        <tr>
          <th>Recurso</th>
          <th>Nombre común</th>
          <th>Especie Científica</th>
          <th>Litoral</th>
          <th>Zona</th>
        </tr>
      </thead>
      <tbody id="esp-tbody"></tbody>
    </table>
  </div>
</div>

<div id="tab-mapa" class="tab-content">
  <div id="map"></div>
</div>

<div id="tab-captura" class="tab-content">
  <div style="text-align:center; margin-bottom:20px;">
    <select id="cap-select" onchange="updateCaptura()">
      <option value="">— Seleccionar Especie para ver histórico —</option>
    </select>
  </div>
  <div class="chart-wrap">
    <canvas id="cap-chart" height="120"></canvas>
  </div>
</div>

<footer class="gob-footer">
  <b>IMIPAS</b> – Instituto Mexicano de Investigación en Pesca y Acuacultura Sustentable
</footer>

<script>
// ID DEL GOOGLE SHEET
const SHEET_ID = '1beFh_u5LFSZNiF5Gpk9SYpWOrJWlrRzSZtuNkf4qcfs';

let datosIndice = [];
let datosCoordenadas = [];
let datosCaptura = [];
let map;
let capChart;

async function sincronizarGoogleSheets() {
  try {
    const urlIndice = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=indice`;
    const urlCoordenadas = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=coordenadas`;
    const urlCaptura = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=captura`;

    const [resIndice, resCoord, resCaptura] = await Promise.all([
      fetch(urlIndice), fetch(urlCoordenadas), fetch(urlCaptura).catch(() => null)
    ]);

    const csvIndice = await resIndice.text();
    const csvCoord = await resCoord.text();
    const csvCaptura = resCaptura && resCaptura.ok ? await resCaptura.text() : "";

    datosIndice = Papa.parse(csvIndice, { header: true, skipEmptyLines: true }).data;
    datosCoordenadas = Papa.parse(csvCoord, { header: true, skipEmptyLines: true }).data;
    if(csvCaptura) datosCaptura = Papa.parse(csvCaptura, { header: true, skipEmptyLines: true }).data;

    document.getElementById('loader').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    
    renderTabla(datosIndice);
    initMap();
    if(datosCaptura.length > 0) initCaptura();

  } catch (error) {
    document.getElementById('loader').innerHTML = `<p style="color:var(--primary)">Error al conectar con la base de datos.</p>`;
  }
}

function showTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.subnav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tabId).style.display = 'block';
  btn.classList.add('active');
  if (tabId === 'mapa' && map) setTimeout(() => map.invalidateSize(), 100);
}

function renderTabla(datos) {
  const tbody = document.getElementById('esp-tbody');
  tbody.innerHTML = '';
  datos.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item['Recurso'] || ''}</td>
      <td><strong>${item['Nombre común'] || item['Nombre comun'] || ''}</strong></td>
      <td><em>${item['Especie'] || item['Especie Científica'] || ''}</em></td>
      <td>${item['Litoral'] || ''}</td>
      <td>${item['Zona'] || ''}</td>
    `;
    tbody.appendChild(tr);
  });
}

function filtrarTabla() {
  const input = document.getElementById("search-esp").value.toLowerCase();
  const rows = document.getElementById("esp-tbody").getElementsByTagName("tr");
  for (let i = 0; i < rows.length; i++) {
    const text = rows[i].innerText.toLowerCase();
    rows[i].style.display = text.includes(input) ? "" : "none";
  }
}

function initMap() {
  map = L.map('map').setView([23.6345, -102.5528], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markerCluster = L.markerClusterGroup();
  
  datosCoordenadas.forEach(upa => {
    const lat = parseFloat(upa.latitud || upa.Latitud);
    const lng = parseFloat(upa.longitud || upa.Longitud);
    
    if(!isNaN(lat) && !isNaN(lng)) {
      const marker = L.marker([lat, lng]);
      marker.bindPopup(`
        <div style="font-family:'Noto Sans'">
          <h4 style="color:#611232; margin-bottom:5px;">${upa.nombre_upa || upa.Nombre || 'UPA'}</h4>
          <p><b>Especie:</b> ${upa.especie || upa.Especie || 'N/A'}</p>
        </div>
      `);
      markerCluster.addLayer(marker);
    }
  });
  map.addLayer(markerCluster);
}

function initCaptura() {
  const select = document.getElementById('cap-select');
  const especiesUnicas = [...new Set(datosCaptura.map(item => item.Especie || item.especie))];
  
  especiesUnicas.forEach(esp => {
    if(esp) {
      const option = document.createElement('option');
      option.value = esp;
      option.textContent = esp;
      select.appendChild(option);
    }
  });
}

function updateCaptura() {
  const especieSel = document.getElementById('cap-select').value;
  if (!especieSel) return;

  const datosFiltrados = datosCaptura.filter(item => (item.Especie || item.especie) === especieSel);
  datosFiltrados.sort((a, b) => (a.anio || a.Año) - (b.anio || b.Año));

  const labels = datosFiltrados.map(d => d.anio || d.Año);
  const weights = datosFiltrados.map(d => Math.round((d.peso_kg || d.Peso) / 1000) || 0); 

  if (capChart) capChart.destroy();
  const ctx = document.getElementById('cap-chart').getContext('2d');
  
  capChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Peso (Toneladas)',
        data: weights,
        backgroundColor: '#611232',
      }]
    },
    options: { responsive: true }
  });
}

window.onload = sincronizarGoogleSheets;
</script>
</body>
</html>
