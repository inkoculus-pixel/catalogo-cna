<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Recursos | IMIPAS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --gob-green: #002f2a;
  --primary: #9b2247; 
  --azul: #33508d;
  --secondary: #a57f2c;
  --text: #161a1d;
  --text2: #98989A;
  --bg: #ffffff; 
  --border: rgba(152, 152, 154, 0.4);
}
body{font-family:'Montserrat', sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}

/* BADGES DE CATEGORÍA */
.badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; text-transform: uppercase; font-weight: 700; margin-right: 6px; display: inline-block; }
.badge-acuacultura { background-color: var(--gob-green); }
.badge-pacifico { background-color: var(--azul); }
.badge-atlantico { background-color: var(--secondary); }

/* (Resto del CSS igual para mantener consistencia...) */
.gobmx-topbar { background-color: var(--gob-green); height: 48px; display: flex; align-items: center; padding: 0 5%; }
.imipas-header { padding: 24px 5%; border-bottom: 4px solid var(--primary); }
.dashboard-container { padding: 30px 5%; max-width: 1800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.map-chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.table-wrap { border-radius:8px; overflow:hidden; border: 1px solid var(--border); }
table{width:100%;border-collapse:collapse;}
thead{background:var(--gob-green);color:#fff}
th{padding:14px 16px;text-transform:uppercase; font-size:12px;}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border);}
.creditos-fuente { font-size: 11px; color: var(--text2); text-align: right; padding: 8px 20px; background: #f8f9fa; border-top: 1px solid var(--border); font-style: italic; }
</style>
</head>
<body>

<div class="gobmx-topbar"><img src="https://framework-gb.cdn.gob.mx/landing/img/logoheader.svg" height="28"></div>

<header class="imipas-header">
  <h1>Instituto Mexicano de Investigación en Pesca y Acuacultura Sustentables</h1>
  <h2>Catálogo de recursos <span class="version-badge">v3.8</span></h2>
</header>

<div id="loader"><div class="spinner"></div></div>

<div id="main-dashboard" class="dashboard-container" style="display:none;">
  <input type="text" id="search-esp" style="padding:15px; width:100%; border-radius:8px; border:1px solid var(--border);" placeholder="Buscar..." oninput="filtrarDashboardGlobal()">
  
  <div class="map-chart-section">
    <div class="map-card"><h3 id="map-title">Mapa <span class="titulo-dinamico-filtro">(Global)</span></h3><div id="map"></div><div class="creditos-fuente">Fuente: SENASICA (2025)</div></div>
    <div class="chart-wrap"><h3 id="chart-title">Producción <span class="titulo-dinamico-filtro">(Global)</span></h3><div class="chart-container-box" id="global-chart-wrapper"><canvas id="cap-chart"></canvas></div><div class="creditos-fuente">Fuente: CONAPESCA (2025)</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Recurso</th><th>Nombre común</th><th>Especie</th><th>Litoral</th></tr></thead>
      <tbody id="esp-tbody"></tbody>
    </table>
  </div>
</div>

<div id="tab-ficha" class="tab-content"><button class="btn-back" onclick="cerrarFicha()">← Regresar</button><div id="ficha-container"></div></div>

<script>
const SHEET_ID = '1beFh_u5LFSZNiF5Gpk9SYpWOrJWlrRzSZtuNkf4qcfs';
let datosIndice = [], datosCoordenadas = [], datosCaptura = [], datosFicha = []; 

// Función para determinar el badge
function getBadge(recurso) {
  const r = (recurso || '').toLowerCase();
  if (r.includes('acuacultura')) return '<span class="badge badge-acuacultura">Acuacultura</span>';
  if (r.includes('pacífico') || r.includes('pacifico')) return '<span class="badge badge-pacifico">Pesca Pacífico</span>';
  if (r.includes('atlántico') || r.includes('atlantico')) return '<span class="badge badge-atlantico">Pesca Atlántico</span>';
  return '';
}

async function sincronizarGoogleSheets() {
  const urls = ['indice', 'coordenadas', 'captura', 'Datos de ficha'];
  const data = await Promise.all(urls.map(s => fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(s)}`).then(r => r.text())));
  
  [datosIndice, datosCoordenadas, datosCaptura, datosFicha] = data.map(t => Papa.parse(t, {header:true, skipEmptyLines:true}).data);
  
  document.getElementById('loader').style.display = 'none';
  document.getElementById('main-dashboard').style.display = 'flex';
  renderTabla(datosIndice);
  initMap();
  actualizarGraficaConsolidada(datosIndice.map(i => i['Común']));
}

function renderTabla(datos) {
  const tbody = document.getElementById('esp-tbody');
  tbody.innerHTML = datos.map(item => `
    <tr class="main-row" onclick="abrirFicha('${item['Común']}')">
      <td>${getBadge(item['Recurso'])} ${item['Recurso']}</td>
      <td>${item['Nombre común']}</td>
      <td><em>${item['Especie'] || ''}</em></td>
      <td>${item['Litoral'] || ''}</td>
    </tr>
  `).join('');
}

// ... (Incluir resto de funciones de Filtrado, Mapa y Gráfica adaptadas de la v3.7) ...

window.onload = sincronizarGoogleSheets;
</script>
</body>
</html>
