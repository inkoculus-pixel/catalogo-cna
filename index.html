<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de recursos | IMIPAS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#611232;
  --primary-dark:#4a0e27;
  --secondary:#a57f2c;
  --bg:#ffffff; 
  --surface:#fff;
  --border:#dee2e6;
  --text:#212529;
  --text2:#6c757d;
}
body{font-family:'Noto Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER INSTITUCIONAL */
.gob-header{background:var(--primary);color:#fff;text-align:center;}
.gob-main{padding:24px 20px; display:flex; flex-direction:column; align-items:center; gap:8px;}
.gob-logo{font-size:32px;font-weight:700;letter-spacing:-0.5px;}
.gob-subtitle{font-size:18px; font-weight:500; opacity:.9;}

/* SUBNAV TABS */
.subnav{background:var(--primary-dark);display:flex;overflow-x:auto; justify-content:center;}
.subnav button{background:none;border:none;color:#ffffffcc;padding:12px 24px;font-size:14px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.subnav button:hover,.subnav button.active{color:#fff;border-bottom-color:var(--secondary);background:rgba(255,255,255,.08)}

/* LAYOUT & CARGA */
.tab-content{display:none; padding:30px 24px; max-width:1400px; margin:0 auto;}
.tab-content.active{display:block}
#loader{text-align:center; padding:80px; font-size:16px; color:var(--text2);}
.spinner {border: 4px solid rgba(0,0,0,.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 0 auto 15px;}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* MAPA */
#map{height:calc(100vh - 280px);width:100%; border-radius:8px; border:1px solid var(--border); z-index: 1;}
.map-wrap{position:relative}

/* TABLA EXPANDIBLE */
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.filter-bar input, .filter-bar select{padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;flex:1;min-width:250px; font-family:'Noto Sans';}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
thead{background:var(--primary);color:#fff}
th{padding:12px 14px;text-align:left;font-size:13px;font-weight:600;}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}

.main-row{cursor:pointer; transition: background 0.2s;}
.main-row:hover{background:#f8f0f2;}
.details-row{display:none; background:#fafafa;}
.details-content{padding:16px 20px; border-left:4px solid var(--primary); color:var(--text2); font-size:13px; display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;}
.details-content strong{color:var(--text);}

/* CAPTURA */
.chart-wrap{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06); max-width: 900px; margin:0 auto;}
select{padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px; min-width:300px; font-family:'Noto Sans';}

/* FOOTER */
.gob-footer{background:#2c2c2c;color:#fff;padding:24px;text-align:center;font-size:12px;margin-top:40px}
</style>
</head>
<body>

<header class="gob-header">
  <div class="gob-main">
    <div class="gob-logo">IMIPAS</div>
    <div class="gob-subtitle">Catálogo de recursos</div>
  </div>
</header>

<nav class="subnav" id="menu" style="display:none;">
  <button class="active" onclick="showTab('especies',this)">Catálogo</button>
  <button onclick="showTab('mapa',this)">Mapa de UPAs</button>
  <button onclick="showTab('captura',this)">Datos de Captura</button>
</nav>

<div id="loader">
  <div class="spinner"></div>
  <p>Sincronizando datos...</p>
</div>

<div id="tab-especies" class="tab-content active">
  <div class="filter-bar">
    <input type="text" id="search-esp" placeholder="Buscar recurso, especie o zona..." onkeyup="filtrarTabla()">
  </div>
  <div style="overflow-x:auto;">
    <table id="tabla-recursos">
      <thead>
        <tr>
          <th>Recurso</th>
          <th>Nombre común</th>
          <th>Especie Científica</th>
          <th>Litoral</th>
        </tr>
      </thead>
      <tbody id="esp-tbody"></tbody>
    </table>
  </div>
</div>

<div id="tab-mapa" class="tab-content">
  <div class="filter-bar">
    <select id="map-esp-select" onchange="filtrarMapa()">
      <option value="">— Mostrar todas las Especies —</option>
    </select>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
  </div>
</div>

<div id="tab-captura" class="tab-content">
  <div style="text-align:center; margin-bottom:20px;">
    <select id="cap-select" onchange="updateCaptura()">
      <option value="">— Seleccionar Especie para ver histórico —</option>
    </select>
  </div>
  <div class="chart-wrap">
    <canvas id="cap-chart" height="120"></canvas>
  </div>
</div>

<footer class="gob-footer">
  <b>IMIPAS</b> – Instituto Mexicano de Investigación en Pesca y Acuacultura Sustentable
</footer>

<script>
const SHEET_ID = '1beFh_u5LFSZNiF5Gpk9SYpWOrJWlrRzSZtuNkf4qcfs';

let datosIndice = [];
let datosCoordenadas = [];
let datosCaptura = [];
let map;
let markerCluster;
let capChart;

async function sincronizarGoogleSheets() {
  try {
    const urlIndice = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=indice`;
    const urlCoordenadas = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=coordenadas`;
    const urlCaptura = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=captura`;

    const [resIndice, resCoord, resCaptura] = await Promise.all([
      fetch(urlIndice), fetch(urlCoordenadas), fetch(urlCaptura).catch(() => null)
    ]);

    const csvIndice = await resIndice.text();
    const csvCoord = await resCoord.text();
    const csvCaptura = resCaptura && resCaptura.ok ? await resCaptura.text() : "";

    datosIndice = Papa.parse(csvIndice, { header: true, skipEmptyLines: true }).data;
    datosCoordenadas = Papa.parse(csvCoord, { header: true, skipEmptyLines: true }).data;
    if(csvCaptura) datosCaptura = Papa.parse(csvCaptura, { header: true, skipEmptyLines: true }).data;

    document.getElementById('loader').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    
    renderTabla(datosIndice);
    initMap();
    if(datosCaptura.length > 0) initCaptura();

  } catch (error) {
    document.getElementById('loader').innerHTML = `<p style="color:var(--primary)">Error al conectar con la base de datos.</p>`;
  }
}

function showTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.subnav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tabId).style.display = 'block';
  btn.classList.add('active');
  if (tabId === 'mapa' && map) setTimeout(() => map.invalidateSize(), 100);
}

// --- TABLA DE ESPECIES ---
function renderTabla(datos) {
  const tbody = document.getElementById('esp-tbody');
  tbody.innerHTML = '';
  
  datos.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.className = 'main-row';
    tr.innerHTML = `
      <td>${item['Recurso'] || ''}</td>
      <td><strong>${item['Nombre común'] || item['Nombre comun'] || ''}</strong></td>
      <td><em>${item['Especie'] || item['Especie Científica'] || ''}</em></td>
      <td>${item['Litoral'] || ''}</td>
    `;
    
    const trDetails = document.createElement('tr');
    trDetails.className = 'details-row';
    trDetails.id = `details-${index}`;
    trDetails.innerHTML = `
      <td colspan="4" style="padding: 0;">
        <div class="details-content">
          <div><p><strong>Zona:</strong></p><p>${item['Zona'] || 'N/A'}</p></div>
          <div><p><strong>Año:</strong></p><p>${item['Año'] || item['anio'] || 'N/A'}</p></div>
          <div><p><strong>Estatus vigente:</strong></p><p>${item['Estatus vigente'] || item['Estatus'] || 'N/A'}</p></div>
          <div><p><strong>Carta Nacional:</strong></p><p>${item['Carta Nacional'] || 'N/A'}</p></div>
        </div>
      </td>
    `;

    tr.onclick = () => {
      const isHidden = trDetails.style.display === 'none' || trDetails.style.display === '';
      trDetails.style.display = isHidden ? 'table-row' : 'none';
      tr.style.background = isHidden ? '#f8f0f2' : '';
    };

    tbody.appendChild(tr);
    tbody.appendChild(trDetails);
  });
}

function filtrarTabla() {
  const input = document.getElementById("search-esp").value.toLowerCase();
  const rows = document.getElementById("esp-tbody").children;
  
  for (let i = 0; i < rows.length; i += 2) {
    const mainRow = rows[i];
    const detailsRow = rows[i+1];
    const textToSearch = (mainRow.innerText + " " + detailsRow.innerText).toLowerCase();
    
    if (textToSearch.includes(input)) {
      mainRow.style.display = "";
    } else {
      mainRow.style.display = "none";
      detailsRow.style.display = "none";
      mainRow.style.background = '';
    }
  }
}

// --- MAPA ---
function initMap() {
  map = L.map('map').setView([23.6345, -102.5528], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap & CARTO'
  }).addTo(map);

  markerCluster = L.markerClusterGroup();
  map.addLayer(markerCluster);

  // Poblar el filtro desplegable de especies del mapa
  const selectMap = document.getElementById('map-esp-select');
  const especiesUnicas = [...new Set(datosCoordenadas.map(item => item['Especie'] || item['especie']))].filter(Boolean).sort();
  
  especiesUnicas.forEach(esp => {
    const option = document.createElement('option');
    option.value = esp;
    option.textContent = esp;
    selectMap.appendChild(option);
  });

  // Renderizar todos los puntos inicialmente
  renderMarcadores("");
}

function filtrarMapa() {
  const especieSel = document.getElementById('map-esp-select').value;
  renderMarcadores(especieSel);
}

function renderMarcadores(filtroEspecie) {
  markerCluster.clearLayers();

  datosCoordenadas.forEach(upa => {
    const especieUPA = upa['Especie'] || upa['especie'] || '';
    
    // Si hay un filtro seleccionado y no coincide, saltamos esta UPA
    if (filtroEspecie && especieUPA !== filtroEspecie) return;

    // Buscar latitudes y longitudes exactas
    const lat = parseFloat(upa['LATITUD F'] || upa['latitud']);
    const lng = parseFloat(upa['LONGITD F'] || upa['longitud']);
    
    if(!isNaN(lat) && !isNaN(lng)) {
      const marker = L.marker([lat, lng]);
      
      const popupText = `
        <div style="font-family:'Noto Sans'; font-size:13px; color:var(--text);">
          <h4 style="color:var(--primary); margin-bottom:6px; border-bottom:1px solid var(--border); padding-bottom:4px;">
            ${upa['nombre_upa'] || upa['Nombre'] || 'Unidad de Producción'}
          </h4>
          <p style="margin-bottom:4px;"><b>Especie:</b> ${especieUPA}</p>
          <p style="margin-bottom:4px;"><b>Superficie de producción (ha):</b> ${upa['Superficie de producción (ha)'] || 'N/A'}</p>
          <p style="margin-bottom:4px;"><b>Número de cuerpos de agua:</b> ${upa['Número de cuerpos de agua'] || 'N/A'}</p>
          <p style="margin-bottom:4px;"><b>Función zootécnica:</b> ${upa['Función zootécnica'] || 'N/A'}</p>
          <p style="margin-bottom:0;"><b>Tipo de instalación:</b> ${upa['Tipo de instalación'] || 'N/A'}</p>
        </div>
      `;
      marker.bindPopup(popupText);
      markerCluster.addLayer(marker);
    }
  });
}

// --- GRÁFICAS DE CAPTURA ---
function initCaptura() {
  const select = document.getElementById('cap-select');
  const especiesUnicas = [...new Set(datosCaptura.map(item => item.Especie || item.especie))];
  
  especiesUnicas.forEach(esp => {
    if(esp) {
      const option = document.createElement('option');
      option.value = esp;
      option.textContent = esp;
      select.appendChild(option);
    }
  });
}

function updateCaptura() {
  const especieSel = document.getElementById('cap-select').value;
  if (!especieSel) return;

  const datosFiltrados = datosCaptura.filter(item => (item.Especie || item.especie) === especieSel);
  datosFiltrados.sort((a, b) => (a.anio || a.Año) - (b.anio || b.Año));

  const labels = datosFiltrados.map(d => d.anio || d.Año);
  const weights = datosFiltrados.map(d => Math.round((d.peso_kg || d.Peso) / 1000) || 0); 
  const valores = datosFiltrados.map(d => Math.round((d.valor_pesos || d.Valor) / 1000000) || 0);

  if (capChart) capChart.destroy();
  const ctx = document.getElementById('cap-chart').getContext('2d');
  
  capChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          type: 'bar',
          label: 'Peso (Toneladas)',
          data: weights,
          backgroundColor: 'rgba(97,18,50,0.7)',
          borderColor: '#611232',
          borderWidth: 1,
          yAxisID: 'y'
        },
        {
          type: 'line',
          label: 'Valor (Millones MXP)',
          data: valores,
          borderColor: '#a57f2c',
          backgroundColor: 'rgba(165,127,44,0.1)',
          borderWidth: 2,
          pointRadius: 4,
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { position: 'left', title: { display: true, text: 'Toneladas' } },
        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Millones MXP' } }
      }
    }
  });
}

window.onload = sincronizarGoogleSheets;
</script>
</body>
</html>
