<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Recursos | IMIPAS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gob-green: #002f2a;
  --primary: #9b2247; 
  --text: #161a1d;
  --text2: #98989A;
  --bg: #ffffff; 
  --border: rgba(152, 152, 154, 0.4);
}
body{font-family:'Montserrat', 'Noto Sans', Arial, sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}

.gobmx-topbar { background-color: var(--gob-green); height: 48px; display: flex; align-items: center; padding: 0 5%; }
.gobmx-topbar img { height: 28px; }

.imipas-header { background-color: #ffffff; padding: 24px 5%; border-bottom: 4px solid var(--primary); display: flex; flex-direction: column; gap: 6px; }
.imipas-header h1 { font-size: 24px; color: var(--gob-green); font-weight: 700; }
.imipas-header h2 { font-size: 16px; color: var(--text2); font-weight: 500; }
.version-badge { font-size: 11px; background: var(--gob-green); color: white; padding: 3px 8px; border-radius: 12px; font-weight: 600; }

.dashboard-container { display: flex; flex-direction: column; gap: 24px; padding: 30px 5%; max-width: 1800px; margin: 0 auto; }
.map-chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 1200px) { .map-chart-section { grid-template-columns: 1fr; } }

.map-card, .chart-wrap { background: #fff; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
.map-card h3, .chart-wrap h3 { padding: 16px 20px; background: #f8f9fa; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--gob-green); text-transform: uppercase; }
.titulo-dinamico-filtro { color: var(--primary); font-weight: 700; text-transform: none; }

#map{height: 400px; width:100%;}
.chart-container-box { padding: 20px; min-height: 360px; }

.filter-bar input{padding:16px 20px;border:1px solid var(--border);border-radius:8px;font-size:15px;width:100%;}
.table-wrap { background:#fff; border-radius:8px; overflow:hidden; border: 1px solid var(--border); }
table{width:100%;border-collapse:collapse;}
thead{background:var(--gob-green);color:#fff}
th{padding:14px 16px;text-align:left;font-size:13px;text-transform:uppercase;}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border);}
.expander { font-size: 10px; color: var(--primary); margin-right: 8px; transition: transform 0.2s ease; display: inline-block; }
.main-row{cursor: pointer;}
.details-row{display:none; background:#fafafa;}

.gobmx-footer { background-color: var(--gob-green); height: 60px; background-image: url('https://framework-gb.cdn.gob.mx/landing/img/pleca.svg'); margin-top: 60px; }
</style>
</head>
<body>

<div class="gobmx-topbar"><img src="https://framework-gb.cdn.gob.mx/landing/img/logoheader.svg" alt="Gobierno de México"></div>
<header class="imipas-header">
  <h1>Instituto Mexicano de Investigación en Pesca y Acuacultura Sustentables</h1>
  <h2>Catálogo de recursos <span class="version-badge">v2.9</span></h2>
</header>

<div id="loader" style="text-align:center; padding:80px;">Sincronizando datos...</div>

<div id="main-dashboard" class="dashboard-container" style="display:none;">
  <div class="filter-section"><div class="filter-bar"><input type="text" id="search-esp" placeholder="Buscar por recurso, especie o entidad..." onkeyup="filtrarDashboardGlobal()"></div></div>
  
  <div class="map-chart-section">
    <div class="map-card"><h3 id="map-title">Distribución Geográfica de UPAs <span class="titulo-dinamico-filtro">(Global)</span></h3><div id="map"></div></div>
    <div class="chart-wrap"><h3 id="chart-title">Histórico de Producción por Entidad <span class="titulo-dinamico-filtro">(Global)</span></h3><div class="chart-container-box" id="global-chart-wrapper"><canvas id="cap-chart"></canvas></div></div>
  </div>

  <div class="table-wrap">
    <table id="tabla-recursos">
      <thead><tr><th>Recurso</th><th>Nombre común</th><th>Especie Científica</th><th>Litoral</th></tr></thead>
      <tbody id="esp-tbody"></tbody>
    </table>
  </div>
</div>

<footer class="gobmx-footer"></footer>

<script>
const SHEET_ID = '1beFh_u5LFSZNiF5Gpk9SYpWOrJWlrRzSZtuNkf4qcfs';
// URL específica para la hoja de Producción (antes Captura)
const SHEET_CAPTURA_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-J0WwCyv07TWzqZi7_J2bDphc1qxMt9i089UhsGITwLWfAHOnW0ecfwkWAqnj1p-cqocrIM0CKC8d/pub?output=csv';

let datosIndice = [], datosCoordenadas = [], datosCaptura = [], datosFicha = []; 
let map, markerCluster, capChart;

async function sincronizarGoogleSheets() {
  try {
    const [resIndice, resCoord, resCaptura] = await Promise.all([
      fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=indice`).then(r => r.text()),
      fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=coordenadas`).then(r => r.text()),
      fetch(SHEET_CAPTURA_URL).then(r => r.text())
    ]);

    datosIndice = Papa.parse(resIndice, { header: true, skipEmptyLines: true }).data;
    datosCoordenadas = Papa.parse(resCoord, { header: true, skipEmptyLines: true }).data;
    datosCaptura = Papa.parse(resCaptura, { header: true, skipEmptyLines: true }).data;

    document.getElementById('loader').style.display = 'none';
    document.getElementById('main-dashboard').style.display = 'flex';
    
    renderTabla(datosIndice);
    initMap();
    actualizarGraficaConsolidada(datosIndice.map(item => item['Común']));
  } catch (e) { console.error(e); }
}

function renderTabla(datos) {
  const tbody = document.getElementById('esp-tbody');
  tbody.innerHTML = '';
  datos.forEach((item) => {
    const tr = document.createElement('tr');
    tr.className = 'main-row';
    tr.onclick = () => {
        const details = tr.nextElementSibling;
        const isHidden = details.style.display === 'none';
        details.style.display = isHidden ? 'table-row' : 'none';
        tr.querySelector('.expander').style.transform = isHidden ? 'rotate(-180deg)' : 'rotate(0deg)';
    };
    tr.innerHTML = `<td><span class="expander">▼</span>${item['Recurso'] || ''}</td><td>${item['Nombre común'] || ''}</td><td><em>${item['Especie'] || ''}</em></td><td>${item['Litoral'] || ''}</td>`;
    tbody.appendChild(tr);
    tbody.appendChild(document.createElement('tr')).className = 'details-row';
  });
}

function filtrarDashboardGlobal() {
  const input = document.getElementById("search-esp").value.toLowerCase().trim();
  const comunesActivos = datosIndice.filter(i => Object.values(i).some(v => String(v).toLowerCase().includes(input))).map(i => i['Común']);
  
  // Actualizar títulos
  document.querySelectorAll('.titulo-dinamico-filtro').forEach(el => el.innerText = input ? `- Filtro: "${input}"` : "(Global)");
  
  renderMarcadoresGlobales(comunesActivos, input);
  actualizarGraficaConsolidada(comunesActivos, input);
}

function initMap() {
  map = L.map('map').setView([23.6345, -102.5528], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
  markerCluster = L.markerClusterGroup();
  map.addLayer(markerCluster);
}

function renderMarcadoresGlobales(comunesValidos, input) {
  markerCluster.clearLayers();
  datosCoordenadas.filter(c => comunesValidos.includes(c['Común'])).forEach(upa => {
      const lat = parseFloat(upa['LATITUD F'] || upa['Latitud']);
      const lng = parseFloat(upa['LONGITD F'] || upa['Longitud']);
      if(!isNaN(lat)) markerCluster.addLayer(L.marker([lat, lng]).bindPopup(upa['nombre_upa'] || 'UPA'));
  });
  if (input === '') map.setView([23.6345, -102.5528], 5);
  else if (markerCluster.getLayers().length > 0) map.fitBounds(markerCluster.getBounds());
}

function actualizarGraficaConsolidada(comunesValidos, input) {
  if (capChart) capChart.destroy();
  
  // Procesar datosCaptura usando los campos exactos: 'ANO', 'ENTIDAD', 'PESO VIVO (KG)', etc.
  const filtered = datosCaptura.filter(d => comunesValidos.includes(d['Común']));
  const años = [...new Set(filtered.map(d => d['ANO']))].sort();
  const entidades = [...new Set(filtered.map(d => d['ENTIDAD']))];
  
  const ctx = document.getElementById('cap-chart').getContext('2d');
  capChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: años,
      datasets: entidades.map((ent, i) => ({
        label: ent,
        data: años.map(a => filtered.filter(f => f['ANO'] === a && f['ENTIDAD'] === ent).reduce((sum, curr) => sum + parseFloat(curr['PESO VIVO (KG)'] || 0), 0)),
        backgroundColor: `hsl(${i * 60}, 50%, 50%)`
      }))
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
  });
}

window.onload = sincronizarGoogleSheets;
</script>
</body>
</html>
